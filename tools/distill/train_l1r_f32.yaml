# AetherRenju L1-R f32 distillation training (rapfi Trainer config)
# Teacher: mix9svq (freestyle bsmix + renju black/white), labels from
# `rapfi distillgen` policy-sampled self play (no search).
# Train:   accelerate launch train.py -c <this file>
# Resume:  accelerate launch train.py -c <rundir>/run_config.yaml
rundir: /home/a/renju/AetherRenju/tools/distill/runs/l1r_f32_v1
train_datas:
  - /home/a/renju/AetherRenju/tools/distill/data/fs_bal_train.bin
  - /home/a/renju/AetherRenju/tools/distill/data/fs_nat_train.bin
  - /home/a/renju/AetherRenju/tools/distill/data/rj_bal_train.bin
  - /home/a/renju/AetherRenju/tools/distill/data/rj_nat_train.bin
val_datas:
  - /home/a/renju/AetherRenju/tools/distill/data/fs_bal_val.bin
  - /home/a/renju/AetherRenju/tools/distill/data/fs_nat_val.bin
  - /home/a/renju/AetherRenju/tools/distill/data/rj_bal_val.bin
  - /home/a/renju/AetherRenju/tools/distill/data/rj_nat_val.bin
dataset_type: distillgen_binary
dataset_args:
  apply_symmetry: true
model_type: aetherl1r
model_args:
  board_size: 15
  line_len: 7
  hidden: 16
  screlu_clamp: 16.0
optim_type: adamw
optim_args:
  betas: [0.9, 0.999]
learning_rate: 0.0015
weight_decay: 0.01
lr_scheduler_type: step
lr_scheduler_args:
  step_size: 10000
  step_gamma: 0.5
loss_type: MSE+NONE
iterations: 40000
batch_size: 2048
# num_worker 0: python 3.14 forkserver would pickle the ~1.5G dataset into
# every worker; in-process loading is already ~80K items/s (> GPU consumption)
num_worker: 0
random_seed: 42
log_interval: 100
show_interval: 500
avg_loss_interval: 500
save_interval: 5000
temp_save_interval: 2500
val_interval: 2500
